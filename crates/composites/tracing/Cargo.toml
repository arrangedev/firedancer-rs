[package]
name = "tracing_fd"
description = "fd_log backend for opentelemetry and tracing"
version.workspace = true
edition.workspace = true

[dependencies]
fd_log = { path = "../../util/log/fd_log" }
fd_json = { path = "../../ballet/json/fd_json" }
tracing = "0.1.41"
tracing-core = "0.1.32"
tracing-subscriber = "0.3.18"
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "logs"] }
opentelemetry-semantic-conventions = "0.27"
once_cell = "1.20"
parking_lot = "0.12"
smallvec = "1.13"

[dev-dependencies]
libc = "0.2.175"
test-case = "3.3.1"
tokio = { version = "1.0", features = ["full"] }
tracing-test = "0.2"