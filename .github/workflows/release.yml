name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (ex: v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-release-
            ${{ runner.os }}-target-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev

      - name: Run full CI pipeline
        run: make ci

  build-release:
    name: Build Release (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-name: linux-x64
          - os: macos-latest
            artifact-name: macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-release-
            ${{ runner.os }}-target-

      - name: Install system deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm

      - name: Build release
        run: make build-release

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          find target/release -name "*.rlib" -o -name "*.so" -o -name "*.dylib" -o -name "*.a" | \
            xargs -I {} cp {} release-artifacts/
          tar -czf firedancer-rs-${{ matrix.artifact-name }}.tar.gz -C release-artifacts .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firedancer-rs-${{ matrix.artifact-name }}
          path: firedancer-rs-${{ matrix.artifact-name }}.tar.gz
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${GITHUB_REF#refs/tags/}\]/,/^## \[/{if(/^## \[${GITHUB_REF#refs/tags/}\]/) p=1; else if(/^## \[/ && p) exit; if(p && !/^## \[${GITHUB_REF#refs/tags/}\]/) print}" CHANGELOG.md > release_notes.txt
          else
            echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.txt
            echo "" >> release_notes.txt
            echo "Built from commit: ${GITHUB_SHA}" >> release_notes.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            artifacts/firedancer-rs-linux-x64/firedancer-rs-linux-x64.tar.gz
            artifacts/firedancer-rs-macos-x64/firedancer-rs-macos-x64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  publish-crates:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc')
    environment: crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev

      - name: Publish sys crates first
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package libfd_bits_sys
          cargo publish --package libfd_math_sys  
          cargo publish --package libfd_log_sys
          cargo publish --package libfd_net_sys

          sleep 30

      - name: Publish wrapper crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package fd_bits
          cargo publish --package fd_math
          cargo publish --package fd_log
          cargo publish --package fd_net
