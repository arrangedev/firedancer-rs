name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-ubuntu:
    name: Test Ubuntu (24.04.2 LTS)
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install System Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config clang libclang-dev llvm-dev make cmake
    
    - name: Setup Rust (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Setup Rust (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    
    - name: Cache Cargo Registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Initialize Submodules
      run: make vinit
    
    - name: Run Formatter Check
      run: cargo +nightly fmt --all -- --check
    
    - name: Run Linter Check
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    
    - name: Build All
      run: make build
    
    - name: Run tests
      run: make tests
    
    - name: Run examples
      run: make examples
    
    - name: Build release
      run: make build-release

  test-macos:
    name: Test on macOS (cross-platform validation)
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Setup Rust (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Setup Rust (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    
    - name: Cache Cargo Registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Initialize Submodules
      run: make vinit
    
    - name: Run Formatter Check
      run: cargo +nightly fmt --all -- --check
    
    - name: Run Linter Check
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    
    - name: Build All
      run: make build
    
    - name: Run Tests
      run: make tests
    
    - name: Run Examples
      run: make examples

  docker-test:
    name: Docker Ubuntu (24.04.2 LTS)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Build Docker Image
      run: make docker-build
    
    - name: Run in Docker
      run: make docker-ci