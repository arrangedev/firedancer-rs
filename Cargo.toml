[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/util/bits/*",
    "crates/util/env/*",
    "crates/util/log/*",
    "crates/util/math/*",
    "crates/util/net/*",
    #"crates/util/tpool/*",
    "crates/util/wksp/*",
    "crates/util/checkpt/*",
    "crates/util/tile/*",
    # "crates/util/valloc/*",
    # "crates/util/scratch/*",
    # "crates/util/spad/*",
    #"crates/util/tmpl/*",
    #"crates/util/shmem/*",
    "crates/tango/*/*",
    "crates/ballet/*/*",
    "crates/flamenco/*/*",
    "crates/funk/*",
    "crates/disco/*/*",
    "crates/composites/*",
    "crates/waltz/quic/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.fast]
inherits = "dev"
lto = true
panic = "abort"
codegen-units = 1
