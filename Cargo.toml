[workspace]
resolver = "2"
members = [
    "crates/bits/*",
    "crates/math/*",
    "crates/log/*",
    "crates/net/*"
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.fast]
inherits = "dev"
lto = true
panic = "abort"
codegen-units = 1
